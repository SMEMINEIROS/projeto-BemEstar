<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal de Escuta - Bem-Estar</title>
        <style>
        /* Importa a fonte arredondada e amigável do Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

     /* Fundo da tela usando o padrão de ícones (doodles) de educação/saúde */
        body {
            font-family: 'Nunito', sans-serif;
            /* Use a imagem como fundo e uma cor base creme */
            background: #fdf8f1 url('fundo-desenhos.png') repeat;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #333;
            min-height: 100vh; /* Garante que o fundo cubra toda a altura da tela */
        }
        /* O Cartão do formulário com cantos bem arredondados e sombra quente */
        .container { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 10px 30px rgba(139, 90, 43, 0.1); max-width: 600px; width: 100%; position: relative; }
        
        /* Estilo das Logos */
        .header-logos { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px dashed #f0e6d2; padding-bottom: 15px; }
        .header-logos img { max-height: 90px; object-fit: contain; }

        /* Textos e Títulos usando o Azul Marinho da sua referência */
        h2 { color: #1e3a8a; margin-top: 0; font-weight: 800; font-size: 1.8em; }
        p.desc { color: #52525b; font-size: 1.05em; margin-bottom: 25px; line-height: 1.5; }
        label { display: block; margin: 15px 0 8px; color: #1e3a8a; font-weight: 700; font-size: 0.95em; }
        
        /* Adicionando ícones decorativos sutis antes dos labels */
        label[for="lotacao"]::before { content: '🏫 '; }
        label[for="categoria"]::before { content: '🤝 '; }
        label[for="descricao"]::before { content: '💬 '; }
        
        /* Campos de digitação mais suaves e gordinhos */
        input[type="text"], select, textarea { width: 100%; padding: 12px 15px; border: 2px solid #e4e4e7; border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 1em; transition: 0.3s; background-color: #fafafa; }
        /* Quando clica no campo, a borda fica Azul Marinho */
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #1e3a8a; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        textarea { resize: vertical; height: 120px; }
        
        /* Área do Anonimato - Estilo "Post-it" Verde de Cuidado (Educação/Saúde Mental) */
        .checkbox-group { display: flex; align-items: center; background: #ecfdf5; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 2px dashed #6ee7b7; transition: 0.3s; }
        .checkbox-group:hover { background: #d1fae5; }
        .checkbox-group input { margin-right: 12px; transform: scale(1.3); accent-color: #059669; cursor: pointer; }
        .checkbox-group label { margin: 0; color: #065f46; cursor: pointer; font-weight: 800; }
        
        /* Botão Acolhedor na cor Azul Marinho ("Educar") */
        button { background-color: #1e3a8a; color: white; border: none; padding: 15px 20px; width: 100%; border-radius: 30px; font-size: 1.1em; cursor: pointer; margin-top: 25px; font-weight: 800; transition: all 0.3s; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3); }
        button:hover { background-color: #163073; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4); }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .hidden { display: none; }
        
        /* Mensagem de Sucesso (Post-it Azul Marinho Suave) */
        #mensagemSucesso { display: none; background: #eff6ff; color: #1e3a8a; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; font-weight: bold; border: 2px dashed #bfdbfe; font-size: 1.1em; }
        
        /* Ajustes apenas para telas de celular */
        @media (max-width: 600px) {
            .header-logos img { max-height: 60px; }
            .header-logos { padding-bottom: 10px; margin-bottom: 15px; }
            .container { padding: 25px 20px; border-radius: 20px; }
            h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-logos">
        <img src="logo-prefeitura.png" alt="Prefeitura Municipal">
        <img src="logo-secretaria.png" alt="Secretaria de Educação">
    </div>

    <h2 id="tituloPagina">Canal de Comunicação Direta</h2>
    <p class="desc" id="descPagina">Espaço seguro e sigiloso gerido pela equipe de Bem-Estar da Secretaria de Educação. Suas demandas psicossociais e sugestões serão analisadas com discrição.</p>

    <div class="checkbox-group">
        <input type="checkbox" id="anonimo">
        <label for="anonimo">Quero enviar meu relato de forma anônima</label>
    </div>

    <form id="formRelato">
        <div id="areaIdentificacao">
            <label for="nome">Nome Completo (Opcional):</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="telefone">Telefone / WhatsApp (Opcional):</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000">
            
            <label for="lotacao">Lotação / Escola (Opcional):</label>
            <input type="text" id="lotacao" placeholder="Onde você atua?">
        </div>

        <label for="categoria">Natureza do Relato:</label>
        <select id="categoria" required>
            <option value="">Selecione uma opção...</option>
        </select>

        <label for="descricao">Descreva a situação:</label>
        <textarea id="descricao" placeholder="Detalhe o ocorrido ou sua sugestão aqui..." required></textarea>

        <button type="submit" id="btnEnviar">Protocolar Relato</button>
    </form>

    <div id="mensagemSucesso">✅ Relato enviado com sucesso! A equipe de Bem-Estar já recebeu sua demanda.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCehAoG1wErUu78hGVPQudmr0C-B4uIz2o",
        authDomain: "projeto-bemestar-8faeb.firebaseapp.com",
        projectId: "projeto-bemestar-8faeb",
        storageBucket: "projeto-bemestar-8faeb.firebasestorage.app",
        messagingSenderId: "185448860439",
        appId: "1:185448860439:web:27e0ff8d9bcf3723338552"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- LÓGICA DE TEXTOS E CATEGORIAS DINÂMICAS (CMS) ---
    const selectCategoria = document.getElementById('categoria');
    
    // Categorias de segurança caso a internet falhe ou o painel não tenha sido salvo ainda
    const categoriasPadrao = [
        "Demanda Psicossocial", 
        "Sugestão de Melhoria", 
        "Reclamação", 
        "Mediação de Conflito"
    ];

    function popularCategorias(lista) {
        selectCategoria.innerHTML = '<option value="">Selecione uma opção...</option>';
        lista.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            selectCategoria.appendChild(opt);
        });
    }

    async function carregarConfiguracoes() {
        try {
            const docRef = doc(db, "configuracoes", "geral");
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const dados = docSnap.data();
                
                // Atualiza Título e Descrição
                if(dados.titulo && dados.titulo.trim() !== "") {
                    document.getElementById('tituloPagina').innerText = dados.titulo;
                }
                if(dados.descricao && dados.descricao.trim() !== "") {
                    document.getElementById('descPagina').innerText = dados.descricao;
                }

                // Atualiza as Categorias
                if (dados.categorias && Array.isArray(dados.categorias) && dados.categorias.length > 0) {
                    popularCategorias(dados.categorias);
                } else {
                    popularCategorias(categoriasPadrao); // Se não tiver array de categorias salvo, usa o padrão
                }
            } else {
                popularCategorias(categoriasPadrao); // Se não existir o documento 'geral' ainda, usa o padrão
            }
        } catch (error) {
            console.log("Erro ao carregar do Firebase. Usando textos padrão da página.", error);
            popularCategorias(categoriasPadrao);
        }
    }
    
    // Inicia a busca das configurações ao carregar a página
    carregarConfiguracoes();

    // --- LÓGICA DO FORMULÁRIO ---
    const chkAnonimo = document.getElementById('anonimo');
    const areaIdentificacao = document.getElementById('areaIdentificacao');
    
    chkAnonimo.addEventListener('change', (e) => {
        if(e.target.checked) {
            areaIdentificacao.classList.add('hidden');
            document.getElementById('nome').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('lotacao').value = '';
        } else {
            areaIdentificacao.classList.remove('hidden');
        }
    });

    document.getElementById('formRelato').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.innerText = "Enviando...";
        btn.disabled = true;

        const isAnonimo = chkAnonimo.checked;
        const dados = {
            anonimo: isAnonimo,
            nome: isAnonimo ? "Anônimo" : document.getElementById('nome').value || "Não informado",
            telefone: isAnonimo ? "Não informado" : document.getElementById('telefone').value || "Não informado",
            lotacao: isAnonimo ? "Não informada" : document.getElementById('lotacao').value || "Não informada",
            categoria: document.getElementById('categoria').value,
            descricao: document.getElementById('descricao').value,
            status: "Novo Pedido",
            dataEnvio: serverTimestamp()
        };

        try {
            await addDoc(collection(db, "relatos"), dados);
            document.getElementById('formRelato').style.display = 'none';
            document.getElementById('mensagemSucesso').style.display = 'block';
        } catch (error) {
            console.error("Erro:", error);
            alert("Erro ao enviar. Tente novamente.");
            btn.innerText = "Protocolar Relato";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
